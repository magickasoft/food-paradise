name: Deploy to GitHub Pages

permissions:
  contents: write # нужно JamesIves-экшену для пуша в gh-pages

# Отменяем предыдущие запуски на той же ветке, чтобы не было гонки при пуше в gh-pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch: # удобно для ручного перезапуска

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -d "./out" ]; then
            echo "Error: out directory does not exist!"
            ls -la
            exit 1
          fi

      - name: Add .nojekyll file
        run: touch ./out/.nojekyll

      # Публикуем ТОЛЬКО при push в master, по расписанию или вручную.
      # На pull_request деплой пропускается — иначе упадёт на форках из-за read-only GITHUB_TOKEN.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
